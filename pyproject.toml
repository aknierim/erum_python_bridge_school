[build-system]
requires = ["hatch-vcs", "hatchling"]
build-backend = "hatchling.build"

[project]
name = "erum-demo"
version = "0.1.0"
description = "A small demo package for the ErUM-Data-Hub Python Bridge School"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.1",
]

[dependency-groups]
tests = []

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/erum_demo/_version.py"

[tool.hatch.build.targets.wheel]
include = ["src/erum_demo"]

[tool.hatch.build.targets.wheel.sources]
"src/erum_demo" = "erum_demo"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
extend-select = [
  "I",  # isort
  "E",  # pycodestyle
  "F",  # Pyflakes
  "UP",  # pyupgrade
  "B",  # flake8-bugbear
  "SIM",  # flake8-simplify
]
ignore = ["B905", "UP038"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["demo"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.pytest.ini_options]
pythonpath = [
  ".", "src",
]
