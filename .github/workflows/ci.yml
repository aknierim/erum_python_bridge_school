name: CI

on:
  push:
    branches:
      - main
    tags:
      - "**"
  pull_request:

env:
  PYTEST_ADDOPTS: --color=yes
  GITHUB_PR_NUMBER: ${{ github.event.number }}

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.14"
            install-method: "mamba"

          - os: ubuntu-latest
            python-version: "3.14"
            install-method: "uv"
            extra-args: ["codecov"]

          - os: ubuntu-latest
            python-version: "3.13"
            install-method: "uv"

          - os: macos-latest
            python-version: "3.14"
            install-method: "uv"

    defaults:
      run:
        # We need login shells (-l) for micromamba to work.
        shell: bash -leo pipefail {0}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare mamba installation
        if: matrix.install-method == 'mamba'
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          # setup correct python version
          sed -i -e "s/- python=.*/- python=$PYTHON_VERSION/g" environment.yml

      - name: mamba setup
        if: matrix.install-method == 'mamba'
        uses: mamba-org/setup-micromamba@ce51e99f4bb8a82ab7158c4dc59ef4634c59c4f9 # v3.1.0
        with:
          environment-file: environment.yml
          cache-downloads: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: false

      - name: Install dependencies
        if: matrix.install-method == 'uv'
        run: uv sync --locked --all-extras --group tests

      - name: Install dependencies
        if: matrix.install-method == 'mamba'
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          python --version
          uv pip install --group tests -e .
          uv pip freeze
          uv pip list

      - name: Run tests
        run: uv run pytest -vv tests

      - name: Upload coverage to Codecov
        if: contains(matrix.extra-args, 'codecov')
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
